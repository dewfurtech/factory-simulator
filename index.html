<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Factory Simulator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root">
      <!-- Shown only when the app's script fails to arrive (some networks drop the connection to *.workers.dev now and
           then); the app replaces this as soon as it starts. Tries once more by itself, then offers a button. -->
      <div
        id="boot-fail"
        hidden
        style="
          font:
            15px/1.6 system-ui,
            sans-serif;
          max-width: 420px;
          margin: 18vh auto;
          padding: 0 16px;
          text-align: center;
          color: #3f3f46;
        "
      >
        <p style="font-size: 17px; font-weight: 600; color: #18181b">โหลดหน้าไม่สำเร็จ</p>
        <p>การเชื่อมต่อหลุดระหว่างโหลด ลองใหม่อีกครั้งได้เลย</p>
        <button onclick="location.reload()" style="font: inherit; padding: 8px 20px; border: 0; border-radius: 8px; background: #ea580c; color: #fff; cursor: pointer">
          ลองใหม่
        </button>
      </div>
    </div>
    <script>
      // When the app's script or stylesheet fails to arrive (the connection was reset), reload once by itself; if it
      // fails again, show the message and the retry button. A slow load is left alone: only a failed one counts.
      (function () {
        var store;
        try {
          store = sessionStorage;
        } catch (e) {
          store = null;
        }
        window.addEventListener(
          'error',
          function (e) {
            var t = e.target;
            if (!t || (t.tagName !== 'SCRIPT' && t.tagName !== 'LINK') || window.__booted) return;
            if (store && !store.getItem('boot-retry')) {
              store.setItem('boot-retry', '1');
              return location.reload();
            }
            if (store) store.removeItem('boot-retry');
            var el = document.getElementById('boot-fail');
            if (el) el.hidden = false;
          },
          true,
        );
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
