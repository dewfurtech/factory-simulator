<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ทดสอบตู้บิ้วอินและเฟอร์นิเจอร์</title>
    <style>
      html,
      body,
      #root {
        margin: 0;
        height: 100%;
        font-family: 'IBM Plex Sans Thai', 'Noto Sans Thai', system-ui, sans-serif;
        font-size: 13px;
        color: #1f2937;
        background: #eef0f3;
      }
      #root {
        display: flex;
      }
      .view {
        flex: 1;
        position: relative;
        min-width: 0;
      }
      .view canvas {
        display: block;
      }
      .panel {
        width: 340px;
        overflow: auto;
        background: #fff;
        border-left: 1px solid #d7dbe0;
        padding: 12px 14px 24px;
        box-sizing: border-box;
      }
      .panel h2 {
        font-size: 14px;
        margin: 14px 0 6px;
      }
      .row {
        display: flex;
        gap: 8px;
        align-items: center;
        margin: 4px 0;
      }
      .row label {
        flex: 1;
        color: #475569;
      }
      .row input[type='number'] {
        width: 72px;
      }
      .row select {
        max-width: 160px;
      }
      .bay {
        border: 1px solid #e2e8f0;
        border-radius: 6px;
        padding: 6px 8px;
        margin: 6px 0;
        background: #f8fafc;
      }
      .bay .row {
        margin: 2px 0;
      }
      button {
        font: inherit;
        padding: 3px 8px;
        border: 1px solid #cbd5e1;
        border-radius: 5px;
        background: #fff;
        cursor: pointer;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        font-size: 12px;
      }
      th,
      td {
        text-align: left;
        padding: 2px 4px;
        border-bottom: 1px solid #eef0f3;
        white-space: nowrap;
      }
      td.n,
      th.n {
        text-align: right;
      }
      .open {
        position: absolute;
        left: 12px;
        bottom: 12px;
        background: rgba(255, 255, 255, 0.92);
        padding: 8px 12px;
        border-radius: 8px;
        display: flex;
        gap: 10px;
        align-items: center;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.15);
      }
      .open input {
        width: 220px;
      }
      .hint {
        position: absolute;
        left: 12px;
        top: 12px;
        color: #475569;
        background: rgba(255, 255, 255, 0.8);
        padding: 4px 8px;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./cabinet.tsx"></script>
  </body>
</html>
